[project]
name = "deepresearch-demo"
version = "0.1.0"
description = "A recoverable and auditable deep-research agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["agent", "deep-research", "langchain", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ddgs>=9,<10",
    "httpx>=0.28,<1",
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "lxml>=5,<7",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
deepresearch = "deepresearch.cli:main"

[project.urls]
Repository = "https://github.com/1612535983/deepreseach-learing"
Issues = "https://github.com/1612535983/deepreseach-learing/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
