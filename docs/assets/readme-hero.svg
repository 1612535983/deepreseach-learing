<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">DeepResearch Agent</title>
  <desc id="desc">A recoverable and auditable research agent that plans, searches, collects evidence, and writes reports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1f2d"/>
      <stop offset="1" stop-color="#102d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1080" cy="72" r="230" fill="url(#glow)"/>
  <circle cx="125" cy="350" r="175" fill="#8b5cf6" fill-opacity="0.08"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="74" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="3">LANGGRAPH RESEARCH AGENT</text>
    <text x="68" y="153" fill="#f8fafc" font-size="55" font-weight="750">DeepResearch</text>
    <text x="68" y="208" fill="url(#accent)" font-size="55" font-weight="750">Agent</text>
    <text x="72" y="249" fill="#cbd5e1" font-size="18">Recoverable · Auditable · Context-aware</text>

    <g transform="translate(72 282)">
      <rect width="116" height="34" rx="17" fill="#0f766e" fill-opacity="0.35" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <text x="58" y="22" fill="#ccfbf1" font-size="13" text-anchor="middle">Checkpointed</text>
      <rect x="128" width="108" height="34" rx="17" fill="#5b21b6" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="182" y="22" fill="#ede9fe" font-size="13" text-anchor="middle">Context-safe</text>
      <rect x="248" width="92" height="34" rx="17" fill="#1e293b" stroke="#64748b" stroke-opacity="0.7"/>
      <text x="294" y="22" fill="#e2e8f0" font-size="13" text-anchor="middle">299 tests</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M 712 105 C 755 105, 765 105, 805 105" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#arrow)"/>
      <path d="M 942 105 C 980 105, 989 105, 1028 105" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#arrow)"/>
      <path d="M 1097 143 C 1097 177, 1097 186, 1097 213" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#arrow)"/>
      <path d="M 1028 252 C 987 252, 975 252, 940 252" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#arrow)"/>

      <g transform="translate(584 68)">
        <rect width="128" height="74" rx="16" fill="#102d3a" stroke="#2dd4bf" stroke-opacity="0.75"/>
        <circle cx="27" cy="27" r="10" fill="#2dd4bf" fill-opacity="0.22"/>
        <text x="27" y="32" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">1</text>
        <text x="64" y="52" fill="#f1f5f9" font-size="17" font-weight="650" text-anchor="middle">Plan</text>
      </g>
      <g transform="translate(813 68)">
        <rect width="128" height="74" rx="16" fill="#102d3a" stroke="#2dd4bf" stroke-opacity="0.75"/>
        <circle cx="27" cy="27" r="10" fill="#2dd4bf" fill-opacity="0.22"/>
        <text x="27" y="32" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">2</text>
        <text x="64" y="52" fill="#f1f5f9" font-size="17" font-weight="650" text-anchor="middle">Search</text>
      </g>
      <g transform="translate(1032 68)">
        <rect width="130" height="74" rx="16" fill="#102d3a" stroke="#2dd4bf" stroke-opacity="0.75"/>
        <circle cx="27" cy="27" r="10" fill="#2dd4bf" fill-opacity="0.22"/>
        <text x="27" y="32" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">3</text>
        <text x="68" y="52" fill="#f1f5f9" font-size="17" font-weight="650" text-anchor="middle">Evidence</text>
      </g>
      <g transform="translate(1032 216)">
        <rect width="130" height="74" rx="16" fill="#242044" stroke="#a78bfa" stroke-opacity="0.85"/>
        <circle cx="27" cy="27" r="10" fill="#a78bfa" fill-opacity="0.24"/>
        <text x="27" y="32" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">4</text>
        <text x="67" y="52" fill="#f5f3ff" font-size="17" font-weight="650" text-anchor="middle">Report</text>
      </g>
      <g transform="translate(788 216)">
        <rect width="152" height="74" rx="16" fill="#172033" stroke="#64748b" stroke-opacity="0.7"/>
        <text x="76" y="31" fill="#94a3b8" font-size="13" text-anchor="middle">cross-task</text>
        <text x="76" y="54" fill="#e2e8f0" font-size="17" font-weight="650" text-anchor="middle">Memory</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#334155" stroke-opacity="0.75"/>
</svg>
